<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kunal Lohaniya - Portfolio</title>
    <meta name="description" content="Kunal Lohaniya - Full Stack Developer Portfolio">
    <meta name="keywords" content="portfolio, developer, react, nodejs, mongodb">
    <meta name="author" content="Kunal Lohaniya">
    
    <!-- Critical Performance: Preconnect to Font Domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Optimized Font Loading: Link instead of CSS @import, with swap strategy -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Kunal Lohaniya - Portfolio">
    <meta property="og:description" content="Full Stack Developer Portfolio">
    <meta property="og:type" content="website">
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4A00E0">
    <link rel="manifest" href="/site.webmanifest">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
    <div id="root"></div>
    <!-- Netlify Form Shadow (Mandatory for React/Vite detection) -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
